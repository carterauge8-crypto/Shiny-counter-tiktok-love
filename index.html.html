<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pokémon Shiny Counter</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif}
.counter{
 color:white;font-weight:900;font-size:58px;letter-spacing:1px;
 text-shadow:3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000;
 white-space:nowrap
}
.sparkle{font-size:54px}
</style>
</head>
<body>
<div class="counter"><span class="sparkle">✨</span> ENCOUNTERS: <span id="count">0</span></div>
<script>
let count = Number(localStorage.getItem("shinyEncounters") || 0);
const el = document.getElementById("count");
function draw(){el.textContent=count;localStorage.setItem("shinyEncounters",count)}
document.addEventListener("keydown",e=>{
 if(e.key==="F1"){count++;draw();e.preventDefault()}
 if(e.key==="F2"){count=Math.max(0,count-1);draw();e.preventDefault()}
 if(e.key==="F3"){count=0;draw();e.preventDefault()}
});
draw();
</script>
</body>
</html>
